# Model 02: Energy Burden Email Open Model
name: "Energy Burden Email Open Model"
description: |
  Logistic regression model predicting email opens based on energy burden
  as the primary predictor, controlling for income level and household size.

  This model tests the hypothesis: households with high energy burden (>6% of income)
  have higher email open rates, controlling for income and household size.

  Research Question: "Do households with high energy burden have higher email open rates,
  controlling for income level and household size?"

  Expected Effects:
    - Energy burden: POSITIVE (high burden -> more need -> higher engagement)
    - Income level: NEGATIVE (lower income -> target population -> higher engagement)
    - Household size: POSITIVE (more people -> more impact -> higher engagement)

version: "1.0"
author: "EmpowerSaves Analytics Team"
status: "active"  # active, beta, deprecated

tags:
  - "email"
  - "open-rate"
  - "energy-burden"
  - "logistic-regression"
  - "confounders"

# Model structure for DAG visualization
model_structure:
  priors:
    - name: "intercept"
      distribution: "Normal(0, 2)"
      description: "Baseline log-odds of email open"
    - name: "beta_burden"
      distribution: "Normal(0.5, 1)"
      description: "Effect of energy burden (slight positive bias expected)"
    - name: "beta_income"
      distribution: "Normal(0, 1)"
      description: "Effect of income level (confounder)"
    - name: "beta_hhsize"
      distribution: "Normal(0, 1)"
      description: "Effect of household size (confounder)"

  likelihood:
    name: "y_open"
    distribution: "Bernoulli(logit_p)"
    description: "Binary outcome - email opened (1) or not (0)"

  linear_model: "logit_p = intercept + beta_burden * energy_burden + beta_income * income_level + beta_hhsize * household_size"

# Parameters for inference/prediction
inference_params:
  - name: "energy_burden"
    type: "float"
    label: "Energy Burden (%)"
    required: true
    min_value: 0
    max_value: 100
    default: 10
    help_text: "Energy burden as percentage of income (energy cost / income * 100)"

  - name: "income_level"
    type: "integer"
    label: "Income Level (0-9)"
    required: true
    min_value: 0
    max_value: 9
    default: 5
    help_text: "Income decile (0=lowest, 9=highest)"

  - name: "household_size"
    type: "integer"
    label: "Household Size"
    required: true
    min_value: 1
    max_value: 10
    default: 3
    help_text: "Number of people in household"

  - name: "credible_interval"
    type: "float"
    label: "Credible Interval"
    default: 0.95
    required: false
    min_value: 0.5
    max_value: 0.99
    help_text: "Width of credible interval (e.g., 0.95 for 95% CI)"

# Training configuration
training:
  default_iterations: 2000
  chains: 4
  warmup: 1000
  target_accept: 0.95
  max_treedepth: 10

# Data requirements
data_requirements:
  source: "campaign_data.participants"
  required_fields:
    - "energy_burden"
    - "income_level"
    - "household_size"
    - "y_opened"
  preprocessing:
    - "Standardize energy_burden, income_level, and household_size to z-scores"
    - "Filter to records with non-null outcome and complete predictor data"

# Model outputs
outputs:
  - name: "open_probability"
    description: "Predicted probability of email open"
  - name: "credible_interval"
    description: "Credible interval bounds for prediction"
  - name: "odds_ratios"
    description: "Odds ratios for each coefficient"
  - name: "coefficient_summary"
    description: "Posterior summary statistics for all parameters"
  - name: "hypothesis_result"
    description: "Primary hypothesis test result (energy burden effect)"
